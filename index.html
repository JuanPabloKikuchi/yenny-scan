<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yenny Scan</title>
<style>
body{font-family:system-ui;background:#111;color:#fff;margin:0;padding:10px}
#video{width:100%;max-width:400px;height:280px;background:#000;border-radius:18px;object-fit:cover;display:block;margin:0 auto}
#out{max-width:400px;margin:14px auto}
.card{background:#222;border-radius:16px;padding:12px;display:flex;gap:12px}
.card img{width:100px;height:150px;object-fit:cover;border-radius:8px;background:#333}
.precio{color:#7CFC00;font-size:22px;font-weight:800;margin-top:8px}
button{width:100%;max-width:400px;margin:10px auto;display:block;padding:14px;border-radius:12px;border:0;font-weight:700}
#startBtn{background:#fff;color:#000}
.sec{background:#333;color:#fff}
input{width:100%;max-width:400px;display:block;margin:8px auto;padding:12px;border-radius:10px;border:1px solid #444;background:#222;color:#fff}
</style>
</head>
<body>
<h3 style="text-align:center">📚 Yenny Scan</h3>
<video id="video" autoplay playsinline muted></video>
<button id="startBtn">📷 TOCA PARA ACTIVAR CÁMARA</button>
<input id="isbn" placeholder="ISBN manual ej: 9789878152349">
<button class="sec" onclick="buscarManual()">BUSCAR</button>
<div id="out"></div>
<canvas id="canvas" style="display:none"></canvas>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2@1.8.2/dist/quagga.min.js"></script>
<script>
const video=document.getElementById('video'), out=document.getElementById('out'), isbnInput=document.getElementById('isbn'), startBtn=document.getElementById('startBtn')
let scanning=false

startBtn.onclick=async()=>{
 if(scanning) return
 try{
  const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}})
  video.srcObject=stream
  scanning=true
  startBtn.textContent='ESCANEANDO... Apunta al código'
  startQuagga()
 }catch(e){alert('No se pudo abrir cámara: '+e.message+'\nUsá el input manual')}
}

function startQuagga(){
 Quagga.init({
  inputStream:{name:'Live',type:'LiveStream',target:video},
  decoder:{readers:['ean_reader','ean_8_reader']}
 },err=>{
  if(err){console.log(err); return}
  Quagga.start()
 })
 Quagga.onDetected(d=>{
  let code=d.codeResult.code
  if(code.length>=10){
   Quagga.stop()
   scanning=false
   video.srcObject.getTracks().forEach(t=>t.stop())
   startBtn.textContent='📷 ESCANEAR OTRO'
   isbnInput.value=code
   buscar(code)
  }
 })
}

async function buscarManual(){ let c=isbnInput.value.replace(/\D/g,''); if(c) buscar(c) }

async function buscar(isbn){
 out.innerHTML='Buscando...'
 try{
  let r=await fetch('/api/buscar?isbn='+isbn).then(r=>r.json())
  out.innerHTML=`<div class=card><img src="${r.tapa}" onerror="this.src='https://via.placeholder.com/100x150?text=Sin+tapa'"><div><b>${r.titulo}</b><br><small>${r.autor||''}</small><br><small style=opacity:.5>${r.isbn}</small><div class=precio>${r.precio}</div></div></div><button class=sec onclick="location.reload()">📷 ESCANEAR OTRO LIBRO</button>`
 }catch(e){ out.innerHTML='Error: '+e }
}
 // Si entras con ?isbn= en la url, busca directo
 const params=new URLSearchParams(location.search)
 if(params.get('isbn')){ isbnInput.value=params.get('isbn'); buscar(params.get('isbn')) }
</script>
</body>
</html>
