<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yenny Scan</title><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><style>body{font-family:system-ui;padding:16px;max-width:480px;margin:auto;background:#f6f6f6}#reader{background:#000;border-radius:16px;overflow:hidden}.card{background:#fff;border-radius:16px;padding:14px;margin-top:14px;display:flex;gap:12px}img{width:110px;height:160px;object-fit:cover;border-radius:10px;background:#eee}input,button{width:100%;padding:14px;border-radius:10px;font-size:16px}input{border:1px solid #ddd;margin-top:10px}button{border:0;background:#000;color:#fff;margin-top:8px}button.sec{background:#fff;color:#000;border:1px solid #000}.precio{font-size:22px;font-weight:800}</style></head><body><h2>📚 Yenny Scan - Precio Real</h2><div id="reader"></div><input id="isbnInput" placeholder="ISBN ej: 9789506448547"><button onclick="buscar()">Buscar precio en Yenny</button><button class="sec" onclick="toggleCam()">📷 Activar / Pausar cámara</button><div id="out"></div><script>let out=document.getElementById('out'),camOn=false,html5Qr;async function toggleCam(){if(camOn){await html5Qr.stop();camOn=false;return}html5Qr=new Html5Qrcode("reader");await html5Qr.start({facingMode:"environment"},{fps:10,qrbox:250},t=>{isbnInput.value=t.replace(/\D/g,'');buscar()});camOn=true}toggleCam();async function buscar(){let isbn=isbnInput.value.replace(/\D/g,'');if(isbn.length<10){alert('ISBN corto');return}out.innerHTML='🔍 Buscando '+isbn+'...';let d=await fetch(`/api/buscar?isbn=${isbn}`).then(r=>r.json());out.innerHTML=`<div class=card><img src="${d.tapa}"><div><b>${d.titulo}</b><br><small>${d.autor||''}</small><br><small>${isbn}</small><div class=precio>${d.precio||'Consultar'}</div><a href="${d.url}" target="_blank" style="display:block;margin-top:8px;background:#000;color:#fff;padding:8px;text-align:center;border-radius:8px;text-decoration:none">Ver en Yenny</a></div></div>`}</script></body></html>
