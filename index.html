<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scan</title><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script></head><body style="background:#111;color:#fff;font-family:system-ui;padding:12px"><div id="reader" style="max-width:380px;margin:auto;background:#000;border-radius:16px;overflow:hidden"></div><button id="b" style="width:100%;max-width:380px;margin:10px auto;display:block;padding:14px;border-radius:12px;border:0;font-weight:800">📷 INICIAR</button><input id="i" placeholder="9789878152349" style="width:100%;max-width:380px;margin:8px auto;display:block;padding:12px;border-radius:10px;background:#222;color:#fff;border:1px solid #444"><div id="o" style="max-width:380px;margin:16px auto"></div><script>
let qr,on=false
document.getElementById('b').onclick=async()=>{
 if(on){await qr.stop();await qr.clear();on=false;return}
 qr=new Html5Qrcode("reader")
 await qr.start({facingMode:"environment"},{fps:10,qrbox:250},t=>{let s=t.replace(/\D/g,'');if(s.length>=10){document.getElementById('i').value=s;buscar(s)}})
 on=true
}
async function buscar(isb){
 let isbn=(isb||'').replace(/\D/g,'')
 document.getElementById('o').innerHTML='Buscando...'
 let d=await fetch('/api/buscar?isbn='+isbn).then(r=>r.json())
 document.getElementById('o').innerHTML=`<div style="background:#1e1e1e;border:1px solid #333;border-radius:16px;padding:12px;display:flex;gap:12px"><img src="${d.tapa}" style="width:110px;height:160px;object-fit:cover;border-radius:8px"><div><div style="font-weight:700">${d.titulo}</div><div style="opacity:.7;font-size:13px">${d.autor}</div><div style="color:#7CFC00;font-weight:900;font-size:22px;margin-top:10px">${d.precio}</div></div></div><button onclick="document.getElementById('o').innerHTML=''" style="width:100%;margin-top:10px;padding:12px;border-radius:10px;background:#222;color:#fff;border:1px solid #444">ESCANEAR OTRO</button>`
}
</script></body></html>
